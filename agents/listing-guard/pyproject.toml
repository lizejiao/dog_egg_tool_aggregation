[project]
name = "listing-guard"
version = "0.1.0"
description = "房源发房上架自动审核 Agent —— LangGraph 多模态验真驱动的自动审核 demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]
live = [
    "langchain-openai>=0.3",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listing_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
