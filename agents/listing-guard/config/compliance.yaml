# 提示词注入特征（命中即强制转人工，模型不允许自由文本影响路由）
injection_patterns:
  - 忽略(上述|以上|前面)(的)?(规则|指令|要求)
  - 直接(判定|审核|评估)(为)?通过
  - (无视|跳过)审核
  - 你是(一个)?(友善|宽松)的审核员
  - ignore (all )?(previous|above) (instructions|rules)
  - system prompt

# 违禁词（合规红线）
banned_words:
  - 低价包过
  - 免押金秒批
  - 内部房源
  - 跳过审核
  - 无房本也能租
  - 隔断房直租

# 联系方式特征（房源描述中不允许出现，防飞单）
contact_patterns:
  - "1[3-9]\\d{9}"
  - "微信[号::]?\\s*[a-zA-Z0-9_-]{4,}"
  - "[Vv][信xX]\\s*[a-zA-Z0-9_-]{4,}"
  - "扫码.{0,6}(看房|联系)"
